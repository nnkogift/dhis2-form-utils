name: Release

on:
    push:
        branches: [main, beta, alpha]

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: write
    pull-requests: write
    # Required for npm trusted publishing (OIDC)
    id-token: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  # Fetch full history for accurate changelogs
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1
                  node-version: 24
                  cache: pnpm
                  # Do not set registry-url here: setup-node would write an auth
                  # .npmrc that blocks npm's OIDC auto-detection.

            - name: Ensure npm supports OIDC trusted publishing
              run: npm install -g npm@latest

            - run: pnpm install --frozen-lockfile

            - name: Build packages
              run: pnpm build:packages

            - name: Create release PR or publish
              uses: changesets/action@v1
              with:
                  version: pnpm version-packages
                  publish: pnpm exec changeset publish
                  title: 'chore: version packages'
                  commit: 'chore: version packages'
                  createGithubReleases: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # Empty on purpose: changesets/action skips writing a real
                  # auth token to .npmrc, so npm can use GitHub OIDC instead.
                  NPM_TOKEN: ''
