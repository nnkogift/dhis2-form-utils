name: CI

on:
    push:
        branches: [main, alpha, beta]
        paths-ignore:
            - '**.md'
            - 'docs/**'
            - 'apps/docs/**'
            - '.idea/**'
            - '.vscode/**'
            - '.cursor/**'
            - '.agents/**'
            - '*.svg'
            - 'LICENSE'
            - '.gitignore'
            - '.github/ISSUE_TEMPLATE/**'
    pull_request:
        branches: [main, alpha, beta]
        paths-ignore:
            - '**.md'
            - 'docs/**'
            - 'apps/docs/**'
            - '.idea/**'
            - '.vscode/**'
            - '.cursor/**'
            - '.agents/**'
            - '*.svg'
            - 'LICENSE'
            - '.gitignore'
            - '.github/ISSUE_TEMPLATE/**'

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - uses: actions/download-artifact@v4
              with:
                  name: build-dist
                  path: .
            - run: pnpm lint

    type-check:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - uses: actions/download-artifact@v4
              with:
                  name: build-dist
                  path: .
            - run: pnpm typecheck

    unit-test:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - uses: actions/download-artifact@v4
              with:
                  name: build-dist
                  path: .
            - run: pnpm exec vitest run

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - uses: actions/upload-artifact@v4
              with:
                  name: build-dist
                  path: |
                      packages/*/dist
                      utils/*/dist
                      components/*/dist

    package-check:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - uses: actions/download-artifact@v4
              with:
                  name: build-dist
                  path: .
            - name: publint
              run: pnpm publint:packages
            - name: size-limit
              run: pnpm size

    storybook-test:
        runs-on: ubuntu-latest
        container:
            image: mcr.microsoft.com/playwright:v1.60.0-noble
        needs: build
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - uses: actions/download-artifact@v4
              with:
                  name: build-dist
                  path: .
            - run: pnpm --filter storybook test

    fallow:
        runs-on: ubuntu-latest
        needs: lint
        continue-on-error: true
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec fallow dead-code || true

    fallow-badge:
        runs-on: ubuntu-latest
        needs: build
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Generate health badge
              run: |
                  mkdir -p badge-out
                  pnpm exec fallow health --format badge > badge-out/badge.svg || true

            - name: Publish badge
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./badge-out
                  publish_branch: badges
                  keep_files: false
