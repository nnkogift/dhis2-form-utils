name: CI

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - uses: actions/download-artifact@v4
              with:
                  name: build-dist
                  path: .
            - run: pnpm lint

    type-check:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - uses: actions/download-artifact@v4
              with:
                  name: build-dist
                  path: .
            - run: pnpm typecheck

    unit-test:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - uses: actions/download-artifact@v4
              with:
                  name: build-dist
                  path: .
            - run: pnpm exec vitest run

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - uses: actions/upload-artifact@v4
              with:
                  name: build-dist
                  path: |
                      utils/*/dist
                      components/*/dist

    storybook-test:
        runs-on: ubuntu-latest
        container:
            image: mcr.microsoft.com/playwright:v1.60.0-noble
        needs: build
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - uses: actions/download-artifact@v4
              with:
                  name: build-dist
                  path: .
            - run: pnpm --filter storybook test

    fallow:
        runs-on: ubuntu-latest
        needs: lint
        continue-on-error: true
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec fallow dead-code || true

    fallow-badge:
        runs-on: ubuntu-latest
        needs: fallow
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Generate health badge
              run: pnpm exec fallow health --format badge > badge.svg || true

            - name: Publish badge
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: .
                  publish_branch: badges
                  keep_files: true
                  include_files: badge.svg
