packages:
    - 'apps/*'
    - 'packages/*'
    - 'utils/*'
    - 'components/*'
allowBuilds:
    '@dhis2/cli-helpers-engine': false
    '@parcel/watcher': false
    '@swc/core': true
    core-js: false
    core-js-pure: false
    esbuild: true
    fallow: false
    msw: true

# These hoists are needed for @dhis2/app-shell since it uses directly some libraries that were hoisted by yarn 1
# This is a better alternative than pnpm's shamefullyHoist https://pnpm.io/settings#shamefullyhoist until we update the way that @dhis2/app-shell works
publicHoistPattern:
    - '@dhis2/ui'
    - 'typeface-roboto'
    - '@dhis2/app-adapter'
    - 'prop-types'
    - '@dhis2/d2-i18n'
    - 'post-robot'
    - 'styled-jsx'
    - '@dhis2/app-adapter'
    - '@dhis2/pwa'

onlyBuiltDependencies:
    - '@dhis2/cli-helpers-engine'
    - '@swc/core'
    - core-js-pure
    - esbuild
    - msw

# Dependabot remediation: force patched versions of transitive deps whose
# direct parents (Docusaurus, changesets, eslint-plugin-react) are already
# on their latest release but haven't picked up the fix yet.
overrides:
    'brace-expansion@<1.1.18': '1.1.18'
    'brace-expansion@>=2.0.0 <2.1.4': '2.1.4'
    'brace-expansion@>=4.0.0 <5.0.9': '5.0.9'
    'js-yaml@>=3.0.0 <3.15.1': '3.15.1'
    'js-yaml@>=4.0.0 <4.3.1': '4.3.1'
    fast-uri: '3.1.7'
    qs: '6.16.0'
    shell-quote: '1.9.0'
    uuid: '11.1.1'
    postcss: '8.5.23'
    loader-utils: '1.4.2'
    undici: '7.29.0'
    serialize-javascript: '7.0.5'
    valibot: '1.4.2'
    esbuild: '0.28.1'
    '@babel/core': '7.29.7'

# image-size@2.0.2 has two open Dependabot alerts (GHSA-w3rx-r6r6-pgpr,
# GHSA-5p2g-fcmc-qvqq: ICNS/JXL/HEIF parser infinite loops) with no patched
# release published upstream yet, so there is no version to override to.
# It's a transitive dep of Docusaurus's MDX image-size plugin, used only at
# docs-build time against trusted repo-local images — low risk. Revisit once
# a fix ships.
